server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    # 后端 API 代理
    # 使用 ^~ 确保 /api/ 下的请求（包括以 .js/.css 结尾的插件 remoteEntry.js）不会被下面的静态资源正则 location 拦截
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级头必须透传，否则 CMS AI 等长连接端点会在边缘按普通 HTTP 返回 400
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # kkFileView 在线文件预览（平台能力）：同源反代到 kkfileview 容器，
    # 避免额外暴露 8012 端口与 HTTPS 混合内容问题；/kkfileview/ 前缀在此剥离。
    # kk 生成预览页资源地址时优先采用 X-Base-Url 请求头（见 kk BaseUrlFilter），
    # 这里按浏览器实际访问的 scheme/host 带上 /kkfileview 前缀，kk 容器侧无需再配 KK_BASE_URL；
    # 能力配置 baseUrl 仍须指向同一浏览器可达地址（如 https://站点/kkfileview）。
    location ^~ /kkfileview/ {
        proxy_pass http://kkfileview:8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Base-Url $scheme://$http_host/kkfileview;
        proxy_http_version 1.1;
        # Office 文档转换可能耗时数分钟，放宽读写超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 前端静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 首页走后端 SEO head 注入（不执行 JS 的抓取方需要真实标题/摘要）
    location = / {
        proxy_pass http://backend:8080/api/public/seo/view?path=/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static;
    }

    # 支持 Vue Router history 模式：静态文件直接命中，页面类请求（无物理文件）走 @seo 注入
    location / {
        try_files $uri @seo;
    }

    # SEO head 注入兜底：后端按路由注入真实标题/摘要/og/robots 后返回 index.html；
    # yudream.seo.enabled=false 或后端不可用时回落 @static 静态壳，行为与未接入特性前一致
    location @seo {
        # $uri 为归一化解码路径，$is_args$args 保留原查询串；SPA slug 字符场景安全
        proxy_pass http://backend:8080/api/public/seo/view?path=$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static;
    }

    location @static {
        try_files /index.html =404;
    }
    client_max_body_size 10240M;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
