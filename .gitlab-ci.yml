# YuDream Admin Core GitLab CI/CD Pipeline

.node_image: &node_image swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:24.15.0-bookworm
.maven_image: &maven_image swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/maven:3.9-eclipse-temurin-21
.docker_cli_image: &docker_cli_image swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/docker:cli

default:
  tags:
    - shared

workflow:
  rules:
    # 默认分支与 MR 流水线只跑 validate-boundary 的轻量版本门禁（validate:host-release-history），
    # 其余作业均有显式 tag 规则，不会在分支上触发任何构建/制品动作
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $CI_COMMIT_TAG =~ /[pdv]/
    - if: $CI_COMMIT_TAG =~ /[wW]/
    - when: never

variables:
  PNPM_IGNORE_PACKAGE_MANAGER_VERSION: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_SETTINGS_PATH: "ci/maven-settings-nexus.xml"
  NEXUS_BASE_URL: "https://nexus.yudream.online"
  NEXUS_MAVEN_PUBLIC_URL: "$NEXUS_BASE_URL/repository/maven-public/"
  NEXUS_MAVEN_RELEASES_URL: "$NEXUS_BASE_URL/repository/maven-releases/"
  NEXUS_MAVEN_SNAPSHOTS_URL: "$NEXUS_BASE_URL/repository/maven-snapshots/"
  NEXUS_NPM_PUBLIC_URL: "$NEXUS_BASE_URL/repository/npm-public/"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  COREPACK_NPM_REGISTRY: "https://registry.npmmirror.com"
  YUDREAM_NPM_REGISTRY: "$NEXUS_NPM_PUBLIC_URL"
  FRONTEND_DIR: "yudream-frontend"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - yudream-frontend/.pnpm-store/
    - .m2/repository/
  policy: pull-push

stages:
  - validate-boundary
  - build-backend
  - build-frontend-main
  - publish-packages
  - verify-packages
  - artifacts
  - build-images
  - deploy-docs

validate:repo-split:
  stage: validate-boundary
  image: alpine:3.20
  script:
    - sh ci/verify-core-plugin-decoupling.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

validate:contract-packages:
  stage: validate-boundary
  image: alpine:3.20
  script:
    - sh ci/verify-contract-packages.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

validate:contract-package-tarballs:
  stage: validate-boundary
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
    - pnpm --dir "$FRONTEND_DIR" install --frozen-lockfile
  script:
    - sh ci/verify-contract-package-tarballs.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

validate:contract-publish-pipeline:
  stage: validate-boundary
  image: alpine:3.20
  script:
    - sh ci/verify-core-contract-publish-pipeline.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

validate:yd-ui:
  stage: validate-boundary
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm --dir "$FRONTEND_DIR" install --frozen-lockfile
  script:
    - pnpm --dir "$FRONTEND_DIR" test:eslint-rules
    - pnpm --dir "$FRONTEND_DIR" audit:ui --baseline=eslint-rules/yd-only-baseline.json
    - pnpm --dir "$FRONTEND_DIR" check:ui-docs
  artifacts:
    when: always
    paths:
      - yudream-frontend/audit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /[pdv]/

validate:plugin-repo-template:
  stage: validate-boundary
  image: alpine:3.20
  script:
    - sh ci/verify-plugin-repo-template.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

validate:docs:
  stage: validate-boundary
  image: alpine:3.20
  script:
    - sh ci/verify-doc-independence.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /[pv]/

# 宿主发版门禁（规则见 docs/dev/release-versioning.md）：
#   默认分支/MR：只检查基线..HEAD 的变更记录覆盖与定级（轻量，不发版）
#   v*（含 rc）：发布全量校验（tag/pom/变更记录/冻结/升版档位/干净树）
#   d*：部署标签同样要求增量变更已覆盖
validate:host-release-history:
  stage: validate-boundary
  image: *node_image
  # 完整历史：基线祖先与 merge-base 判定禁用浅克隆
  variables:
    GIT_DEPTH: "0"
  script:
    - node ci/host-release.mjs check-changes --json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

validate:host-release:
  stage: validate-boundary
  image: *node_image
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      case "$CI_COMMIT_TAG" in
        v*) node ci/host-release.mjs validate --tag "$CI_COMMIT_TAG" --json ;;
        d*) node ci/host-release.mjs check-changes --json ;;
        *) echo "跳过宿主发版校验（$CI_COMMIT_TAG）" ;;
      esac
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

build:backend:
  stage: build-backend
  image: *maven_image
  script:
    - echo "mvn -s $MAVEN_SETTINGS_PATH clean install -pl yudream-bootstrap -am -DskipTests -B -e"
    # 运行时构建版本注入 tag 原文（vX.Y.Z / vX.Y.Z-rc.N / dX.Y.Z）；
    # 默认（本地裸构建）回落 pom 的 <yudream.host.version>-dev.local，不冒充正式版
    - mvn -s "$MAVEN_SETTINGS_PATH" clean install -pl yudream-bootstrap -am -DskipTests -B -e -Dyudream.host.build-version="$CI_COMMIT_TAG"
  artifacts:
    name: "core-backend-${CI_COMMIT_SHORT_SHA}"
    paths:
      - yudream-bootstrap/target/*.jar
      - yudream-plugins/yudream-plugin-spi/target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

build:frontend-main:
  stage: build-frontend-main
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
  script:
    - cd "$FRONTEND_DIR"
    - pnpm install --frozen-lockfile
    - pnpm --filter @fantastic-admin/core-arco-design-vue run build
  artifacts:
    name: "core-frontend-${CI_COMMIT_SHORT_SHA}"
    paths:
      - yudream-frontend/apps/core-arco-design-vue/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

# 契约包发布 tag 约定：
#   v* / 裸 p*（如 p2.15.0）发布并验签全部契约包（SPI + plugin-sdk + components + dataviz）；
#   pspi-* 只发布/验签 yudream-plugin-spi（Maven）；
#   psdk-* 只发布/验签 @yudream/plugin-sdk；
#   pcomp-* 只发布/验签 @yudream/components；
#   pdviz-* 只发布/验签 @yudream/dataviz。
# 各作业用「排除其他分包 tag 后回落到 [pv]」的 rules 实现该拆分。
publish:maven-plugin-spi:
  stage: publish-packages
  image: *maven_image
  script:
    - echo "Deploy yudream-plugin-spi to Nexus"
    - mvn -s ci/maven-settings-nexus.xml -f yudream-plugins/yudream-plugin-spi/pom.xml -DskipTests deploy -B -ntp -e
  rules:
    - if: $CI_COMMIT_TAG =~ /^psdk/ || $CI_COMMIT_TAG =~ /^pcomp/ || $CI_COMMIT_TAG =~ /^pdviz/
      when: never
    # 候选版（rc）不发布正式契约包：契约版本未变时禁止重复发布，避免 Nexus 拒绝重发导致的红流水线
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

verify:maven-plugin-spi:
  stage: verify-packages
  image: *maven_image
  script:
    - sh ci/verify-plugin-spi-registry.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^psdk/ || $CI_COMMIT_TAG =~ /^pcomp/ || $CI_COMMIT_TAG =~ /^pdviz/
      when: never
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

verify:npm-contracts:
  stage: verify-packages
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
  script:
    - VERIFY_NPM_REGISTRY="$NEXUS_NPM_PUBLIC_URL" sh ci/verify-published-npm-contracts.sh
  rules:
    # VERIFY_NPM_PACKAGES 限定验签范围；pspi 标签不涉及 npm 契约，直接跳过
    - if: $CI_COMMIT_TAG =~ /^pspi/
      when: never
    - if: $CI_COMMIT_TAG =~ /^psdk/
      variables:
        VERIFY_NPM_PACKAGES: "@yudream/plugin-sdk"
    - if: $CI_COMMIT_TAG =~ /^pcomp/
      variables:
        VERIFY_NPM_PACKAGES: "@yudream/components"
    - if: $CI_COMMIT_TAG =~ /^pdviz/
      variables:
        VERIFY_NPM_PACKAGES: "@yudream/dataviz"
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

publish:npm-plugin-sdk:
  stage: publish-packages
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
  script:
    - cd "$FRONTEND_DIR"
    - pnpm install --frozen-lockfile
    - pnpm --filter @yudream/plugin-sdk run build
    - |
      REGISTRY_HOST=$(echo "$NEXUS_NPM_PUBLIC_URL" | sed -E 's#^https?://##' | sed 's#/$##')
      printf '%s\n' \
        "@yudream:registry=$NEXUS_NPM_PUBLIC_URL" \
        "//$REGISTRY_HOST/:username=$NEXUS_USERNAME" \
        "//$REGISTRY_HOST/:_password=$(printf '%s' "$NEXUS_PASSWORD" | base64 | tr -d '\n')" \
        'always-auth=true' > .npmrc
    - |
      cd packages/plugin-sdk
      # 幂等发布：版本已在目标仓库时跳过（重打标签重跑验签的场景），其余错误照常失败；
      # 发布结果仍由 verify:npm-contracts 从仓库回读校验
      PKG_VERSION=$(node -p "require('./package.json').version")
      if npm view "@yudream/plugin-sdk@$PKG_VERSION" version --registry "$NEXUS_NPM_PUBLIC_URL" >/dev/null 2>&1; then
        echo "@yudream/plugin-sdk@$PKG_VERSION 已存在于 $NEXUS_NPM_PUBLIC_URL，跳过发布"
      else
        pnpm publish --no-git-checks --registry "$NEXUS_NPM_PUBLIC_URL"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^pspi/ || $CI_COMMIT_TAG =~ /^pcomp/ || $CI_COMMIT_TAG =~ /^pdviz/
      when: never
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

publish:npm-components:
  stage: publish-packages
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
  script:
    - cd "$FRONTEND_DIR"
    - pnpm install --frozen-lockfile
    - pnpm --filter @yudream/components run build
    - |
      REGISTRY_HOST=$(echo "$NEXUS_NPM_PUBLIC_URL" | sed -E 's#^https?://##' | sed 's#/$##')
      printf '%s\n' \
        "@yudream:registry=$NEXUS_NPM_PUBLIC_URL" \
        "//$REGISTRY_HOST/:username=$NEXUS_USERNAME" \
        "//$REGISTRY_HOST/:_password=$(printf '%s' "$NEXUS_PASSWORD" | base64 | tr -d '\n')" \
        'always-auth=true' > .npmrc
    - |
      cd packages/components
      # 幂等发布：版本已在目标仓库时跳过（重打标签重跑验签的场景），其余错误照常失败
      PKG_VERSION=$(node -p "require('./package.json').version")
      if npm view "@yudream/components@$PKG_VERSION" version --registry "$NEXUS_NPM_PUBLIC_URL" >/dev/null 2>&1; then
        echo "@yudream/components@$PKG_VERSION 已存在于 $NEXUS_NPM_PUBLIC_URL，跳过发布"
      else
        pnpm publish --no-git-checks --registry "$NEXUS_NPM_PUBLIC_URL"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^pspi/ || $CI_COMMIT_TAG =~ /^psdk/ || $CI_COMMIT_TAG =~ /^pdviz/
      when: never
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

publish:npm-dataviz:
  stage: publish-packages
  image: *node_image
  before_script:
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
  script:
    - cd "$FRONTEND_DIR"
    - pnpm install --frozen-lockfile
    - pnpm --filter @yudream/dataviz run build
    - |
      REGISTRY_HOST=$(echo "$NEXUS_NPM_PUBLIC_URL" | sed -E 's#^https?://##' | sed 's#/$##')
      printf '%s\n' \
        "@yudream:registry=$NEXUS_NPM_PUBLIC_URL" \
        "//$REGISTRY_HOST/:username=$NEXUS_USERNAME" \
        "//$REGISTRY_HOST/:_password=$(printf '%s' "$NEXUS_PASSWORD" | base64 | tr -d '\n')" \
        'always-auth=true' > .npmrc
    - |
      cd packages/dataviz
      # 幂等发布：版本已在目标仓库时跳过（重打标签重跑验签的场景），其余错误照常失败
      PKG_VERSION=$(node -p "require('./package.json').version")
      if npm view "@yudream/dataviz@$PKG_VERSION" version --registry "$NEXUS_NPM_PUBLIC_URL" >/dev/null 2>&1; then
        echo "@yudream/dataviz@$PKG_VERSION 已存在于 $NEXUS_NPM_PUBLIC_URL，跳过发布"
      else
        pnpm publish --no-git-checks --registry "$NEXUS_NPM_PUBLIC_URL"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^pspi/ || $CI_COMMIT_TAG =~ /^psdk/ || $CI_COMMIT_TAG =~ /^pcomp/
      when: never
    - if: $CI_COMMIT_TAG =~ /-rc\.[1-9][0-9]*$/
      when: never
    - if: $CI_COMMIT_TAG =~ /[pv]/

collect:artifacts:
  stage: artifacts
  image: *node_image
  dependencies:
    - build:backend
    - build:frontend-main
  script:
    - mkdir -p dist/backend dist/frontend dist/contracts
    - cp yudream-bootstrap/target/*.jar dist/backend/ || true
    - cp yudream-plugins/yudream-plugin-spi/target/*.jar dist/contracts/ || true
    - cp -r yudream-frontend/apps/core-arco-design-vue/dist dist/frontend/ || true
    - ls -R dist
  artifacts:
    name: "yudream-admin-core-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

# 宿主镜像发布走 ci/publish-host-images.sh（行为要点见脚本头注释）：
#   正式 v* 才晋升 latest（d* 部署标签不再触碰 latest，修复旧脚本问题；rc 同样不晋升）；
#   不可变标签（精确版本/短 SHA）先查远端占用，同 commit 复用、不同 commit 拒绝覆盖；
#   晋升前防倒退 fail closed；正式版必须双仓验证一致才写发布证据并晋升；
#   rc/dev 不晋升 latest、rc 允许 ALIYUN_PUSH_ENABLED=false 单仓演进。
publish:host-images:
  stage: build-images
  image: *docker_cli_image
  resource_group: yudreamadmin-images
  variables:
    HOST_BUILD_VERSION: "$CI_COMMIT_TAG"
  dependencies:
    - build:backend
    - build:frontend-main
  script:
    - apk add --no-cache jq
    - sh ci/publish-host-images.sh
  artifacts:
    name: "host-images-evidence-${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/images/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v|d)/

# 文档站仅在名称包含 w/W 的 Git tag 上构建并通过 FTP/FTPS 发布。
deploy:docs-ftp:
  stage: deploy-docs
  image: *node_image
  variables:
    FTP_PORT: "21"
    FTP_TLS: "true"
    FTP_SSL_VERIFY: "true"
    FTP_DELETE: "true"
  before_script:
    # apt 官方源在国内 runner 上极慢：切阿里云镜像后再装工具
    - sed -i 's/deb.debian.org/mirrors.aliyun.com/g' /etc/apt/sources.list.d/debian.sources /etc/apt/sources.list 2>/dev/null || true
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends lftp ca-certificates
    - npm config set registry "$NPM_CONFIG_REGISTRY"
    - corepack enable && corepack prepare pnpm@11.9.0 --activate
    - pnpm config set registry "$NPM_CONFIG_REGISTRY"
    - node -v
    - pnpm -v
    - |
      for required in FTP_HOST FTP_USER FTP_PASSWORD FTP_REMOTE_DIR; do
        if [ -z "${!required:-}" ]; then
          echo "缺少 GitLab CI/CD 变量: $required"
          exit 1
        fi
      done
  script:
    # yd-docs/uno.config.ts 复用前端 Uno 配置，先安装前端 workspace 依赖以解析 themes 与组件依赖。
    - cd yudream-frontend
    - pnpm install --frozen-lockfile
    - cd ../yd-docs
    - pnpm install --frozen-lockfile
    - pnpm build
    - |
      mirror_args="--reverse --verbose"
      if [ "$FTP_DELETE" = "true" ]; then
        mirror_args="$mirror_args --delete"
      fi
      echo "发布文档到 FTP 目录: $FTP_REMOTE_DIR"
      lftp <<LFTP
      set net:timeout 30
      set net:max-retries 2
      set net:reconnect-interval-base 5
      set ftp:ssl-force $FTP_TLS
      set ftp:ssl-protect-data $FTP_TLS
      set ssl:verify-certificate $FTP_SSL_VERIFY
      open -p $FTP_PORT -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
      mirror $mirror_args "$CI_PROJECT_DIR/yd-docs/docs/.vitepress/dist" "$FTP_REMOTE_DIR"
      bye
      LFTP
  artifacts:
    name: "yd-docs-${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - yd-docs/docs/.vitepress/dist/
    expire_in: 1 week
  environment:
    name: production/docs
  rules:
    - if: '$CI_COMMIT_TAG =~ /[wW]/'
