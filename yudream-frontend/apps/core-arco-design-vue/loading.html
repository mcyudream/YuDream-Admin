<!-- 启动页：上游 NMO loading.gif + Cubic 11 / Minecraft-Tenv2 像素字体（SIL OFL，见 public/fonts/OFL-cubic11.txt） -->
<style>
@font-face {
  font-family: 'Cubic 11';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/cubic-11.woff2') format('woff2');
}

@font-face {
  font-family: 'Minecraft-Tenv2';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/Minecraft-Tenv2.woff2') format('woff2');
  unicode-range: U+0020-007E;
}

.loading-container {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: #6cc349;
  user-select: none;
  background-color: #0f0e0d;
  image-rendering: pixelated;
}

.loading-container .loading {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 96px;
  height: 96px;
}

.loading-container .loading img {
  width: 96px;
  height: 96px;
  image-rendering: pixelated;
}

.loading-container .name {
  position: relative;
  margin-top: 16px;
  font-family: 'Minecraft-Tenv2', 'Cubic 11', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  font-size: 22px;
  line-height: 1.5;
  color: #f7f5ee;
  text-shadow: 2px 2px 0 #000;
}

.loading-container .tips {
  position: relative;
  margin-top: 8px;
  font-family: 'Cubic 11', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  font-size: 16px;
  color: rgba(247, 245, 238, 0.65);
  line-height: 1.5;
}

.loading-container .tips::after {
  position: absolute;
  padding-left: 5px;
  content: "…";
}
</style>

<div class="loading-container">
  <div class="loading">
    <img src="/loading.gif" alt="" width="96" height="96">
  </div>
  <div class="name"></div>
  <div class="tips">载入中</div>
</div>
